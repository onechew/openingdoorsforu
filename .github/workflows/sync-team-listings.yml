name: Sync Thapar Listings

# Manual only — every-6-hours cron removed. thaparteam.ca sits behind Cloudflare;
# GitHub-hosted runners usually get a bot challenge, so the script soft-skips on
# schedule (if cron is re-enabled) and keeps the last committed inventory.
# Refresh listings by running scripts/sync-team-listings.py locally (then push),
# or move this job to a self-hosted runner / scraping proxy.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-team-listings
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync featured listings + regenerate pages
        run: python3 scripts/sync-team-listings.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Commit if inventory changed
        run: |
          if git diff --quiet -- data/listings.json data/thapar-search-params.json \
            assets/active-listings.js index.html \
            toronto etobicoke north-york markham richmond-hill vaughan mississauga sitemap.xml; then
            echo "No listing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/thapar-search-params.json \
            assets/active-listings.js index.html \
            toronto etobicoke north-york markham richmond-hill vaughan mississauga sitemap.xml
          git commit -m "Sync Thapar Team featured listings."
          git push
